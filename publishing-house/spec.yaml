# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable: false
    assessment_strategy: ""
    catalog_gap: ""
    design_overview: "Red Hat Satellite Basics 6.19 is a beginner-level, GUI-driven lab that walks participants through the core Satellite lifecycle management workflow on RHEL 10 hosts. Participants configure lifecycle environments, content views, activation keys, and host groups; register managed hosts via the hammer CLI; apply errata and install software; and explore Red Hat Lightspeed and AI-assisted management via the Satellite MCP server. The lab is migrated from an existing Zero Touch guided lab and covers 14 modules across approximately 3 hours of hands-on content."
    module_summaries:
      - title: "Introduction to Red Hat Satellite 6.19 Basics"
        overview: "Introduces the lab topology (Satellite 6.19 server, two RHEL 10 managed hosts, and an AI host) and guides participants through logging into the Satellite Web UI with provided admin credentials."
      - title: "Synchronize Repositories"
        overview: "Documents how to enable and synchronize RHEL 10 BaseOS and AppStream repositories from the Red Hat CDN; steps are read-only as repos are pre-synchronized in the lab environment to save time."
      - title: "Create a Lifecycle Environment"
        overview: "Introduces application lifecycle environments in Satellite and walks through creating a 'Test' lifecycle environment path in the web UI."
      - title: "Create a Content View"
        overview: "Creates a 'RHEL10' content view containing BaseOS and AppStream repositories, then publishes and promotes it to the Test lifecycle environment."
      - title: "Create an Activation Key"
        overview: "Creates a 'RHEL10' activation key linked to the Test lifecycle environment and RHEL10 content view to automate subscription attachment during host registration."
      - title: "Configure a Host Group"
        overview: "Creates an 'Application Servers' host group, assigns the rhel-system-roles.firewall Ansible role to open port 80/tcp, and links the RHEL10 activation key."
      - title: "Register Hosts"
        overview: "Uses the hammer CLI to generate a global registration script and registers rhel1 and rhel2 via SSH, then verifies registration and repo configuration in the Satellite Web UI."
      - title: "Red Hat Lightspeed for Satellite"
        overview: "Explores Red Hat Lightspeed Advisor recommendations in a disconnected Satellite environment and demonstrates applying remediations via auto-generated Ansible playbooks; also covers the tech-preview Vulnerability service with CVE map download."
      - title: "Enable the Tracer Service on RHEL Hosts"
        overview: "Adds the Satellite Client 6 repository to the RHEL10 content view and installs katello-host-tools-tracer on managed hosts via Satellite remote execution."
      - title: "Update Errata"
        overview: "Filters to installable errata in the Satellite Web UI and applies them to rhel1 and rhel2 through remote execution, then restarts affected services using the Traces tab."
      - title: "Install Software"
        overview: "Creates a 'TMUX installation' host collection and installs tmux simultaneously on rhel1 and rhel2 using Satellite's Package Installation, Removal, and Update feature."
      - title: "Filter Content"
        overview: "Creates an exclude filter in the RHEL10 content view to block the emacs package, publishes a new content view version, and verifies the filter blocks dnf installation on the host."
      - title: "Satellite AI Integration"
        overview: "Demonstrates Satellite's MCP server integration enabling natural language queries of Satellite inventory data, errata discovery, and triggering remote execution patching jobs via the opencode TUI using the minimax-m2 model."
      - title: "Conclusion"
        overview: "Wraps up the lab with links to additional resources including convert2rhel and RHEL System Roles documentation."
    rcars_overlap_pct: 62
    rcars_top_matches:
      - title: "LB1305 - AI-Powered RHEL Management with MCP & Satellite"
        ci_name: "summit-2026.lb1305-ai-powered-rhel-mgmt-cnv.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=summit-2026.lb1305-ai-powered-rhel-mgmt-cnv.prod"
        relevance_score: 62
        why_it_fits: "Covers AI-driven inventory and management using MCP servers for Satellite, Lightspeed, and RHEL — natural language CVE and patching workflows."
        workloads:
          - role: "agnosticv_userdata_import"
            collection: "agnosticd.cloud_vm_workloads"
          - role: "asset_injector"
            collection: "rhpds.manage_host"
          - role: "break_httpd"
            collection: "rhpds.rhel_management"
      - title: "Red Hat Satellite Compliance"
        ci_name: "zt-rhelbu.zt-satellite-compliance.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=zt-rhelbu.zt-satellite-compliance.prod"
        relevance_score: 57
        why_it_fits: "Builds a content view, creates an activation key and host group, and registers hosts — the same foundational steps as this lab."
        workloads: []
    catalog_gap: "Only beginner-level end-to-end Satellite 6.19 basics lab in the catalog. The AI integration via MCP (Module 13) overlaps with LB1305 but arrives after learners have completed the full workflow manually — a meaningfully different pedagogical path that neither existing lab provides."
    rejections: []

