spec:
  title: "Red Hat Satellite Basics 6.19"
  learning_objectives:
    - "Configure lifecycle environments, content views, and activation keys in Red Hat Satellite 6.19 to control software delivery to RHEL 10 hosts"
    - "Create host groups and assign Ansible roles to enforce baseline system configuration across managed hosts"
    - "Register RHEL 10 hosts to Satellite using a global registration script generated by the hammer CLI"
    - "Manage Red Hat Lightspeed Advisor recommendations and apply auto-generated Ansible playbooks for remediation in a disconnected Satellite environment"
    - "Configure the Satellite Client 6 repository and install katello-host-tools-tracer to detect services requiring restart after package updates"
    - "Apply errata to managed hosts and resolve service traces using Satellite remote execution"
    - "Install and filter software packages on managed host collections using Satellite content management and package filtering capabilities"
    - "Explore Satellite MCP server integration to query inventory and trigger remote execution jobs using natural language prompts"
  modules:              # [{id, title, duration_min, status}] — id is stable (e.g. module-01)
    - id: module-01
      title: "Introduction to Red Hat Satellite 6.19 Basics"
      duration_min: 10
      status: not_started
    - id: module-02
      title: "Synchronize Repositories (documentation)"
      duration_min: 10
      status: not_started
    - id: module-03
      title: "Create a Lifecycle Environment"
      duration_min: 10
      status: not_started
    - id: module-04
      title: "Create a Content View"
      duration_min: 15
      status: not_started
    - id: module-05
      title: "Create an Activation Key"
      duration_min: 10
      status: not_started
    - id: module-06
      title: "Configure a Host Group"
      duration_min: 15
      status: not_started
    - id: module-07
      title: "Register Hosts"
      duration_min: 15
      status: not_started
    - id: module-08
      title: "Red Hat Lightspeed for Satellite"
      duration_min: 20
      status: not_started
    - id: module-09
      title: "Enable the Tracer Service on RHEL Hosts"
      duration_min: 20
      status: not_started
    - id: module-10
      title: "Update Errata"
      duration_min: 15
      status: not_started
    - id: module-11
      title: "Install Software"
      duration_min: 15
      status: not_started
    - id: module-12
      title: "Filter Content"
      duration_min: 15
      status: not_started
    - id: module-13
      title: "Satellite AI Integration"
      duration_min: 20
      status: not_started
    - id: module-14
      title: "Conclusion"
      duration_min: 5
      status: not_started
  environment:
    platform: "rhel-vms"               # ocp | rhel-vms — determines which sizing fields apply
    topology: "per-student"            # shared-cluster | per-student | cnv-pool
    cloud_provider: cnv                # cnv | aws — cnv is default
    max_concurrent_users: null         # required if topology = shared-cluster

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: ""                    # e.g. 4.20 — minimum 4.20; leave empty for rhel-vms
    cluster_type: ""                   # sno | multinode — only for platform = ocp
    control_plane_instance_count: null # 1 if sno, 3 if multinode
    control_plane_cpu: null            # 32 if sno, 16 if multinode
    control_plane_ram_gb: null         # 128 if sno, 64 if multinode
    worker_count: null                 # number of OCP worker nodes
    worker_cpu: null                   # vCPU per worker
    worker_ram_gb: null                # RAM per worker in GB
    worker_disk_gb: null               # disk per worker in GB

    # --- VM-specific fields (only when platform = rhel-vms) ---
    # Each entry: {role, count, cpu, ram_gb, disk_gb, os, hostname}
    vms_per_student:
      - role: satellite-server
        count: 1
        cpu: 8
        ram_gb: 32
        disk_gb: 250
        os: "RHEL"
        hostname: "satellite.lab"
      - role: managed-host
        count: 1
        cpu: 2
        ram_gb: 4
        disk_gb: 20
        os: "RHEL 10"
        hostname: "rhel1.lab"
      - role: managed-host
        count: 1
        cpu: 2
        ram_gb: 4
        disk_gb: 20
        os: "RHEL 10"
        hostname: "rhel2.lab"
      - role: ai-host
        count: 1
        cpu: 16
        ram_gb: 64
        disk_gb: 50
        os: "RHEL AI"
        hostname: "rhel-ai.lab"

    # --- Common fields (both platforms) ---
    aap_version: ""                    # required if AAP in products
    ai_requirement: "maas"             # maas | gpu | none
    ai_model_tier: "open-source"       # open-source | frontier (if ai_requirement = maas or gpu)
    ai_model_name: "minimax-m2"        # specific model e.g. granite-3.1-8b
    ai_justification: ""               # required if ai_model_tier = frontier or ai_requirement = gpu
    non_ga_products:
      - "Red Hat Lightspeed Vulnerability (tech preview)"
    non_ga_access_plan: "local/on-premises"  # how access is provided for non-GA products
    external_services:
      - "security.access.redhat.com"
    gpu_nodes: 0                       # number of GPU nodes (0 = none)
    gpu_type: ""                       # e.g. NVIDIA A100 40GB (required if gpu_nodes > 0)
  duration_hours: 3
  audience: "beginner"                 # beginner | intermediate | advanced

